schemaVersion: 1
severity: warning
message: Perform explicit null and type checks on the results

target:
  type: ast-grep
  language: typescript
  pattern: JSON.parse($A) as $B
  scope:
    fileGlobs:
      - '**/*.ts'
    excludeGlobs:
      - '**/registry.ts'

examples:
  - bad: const data = JSON.parse(raw) as LockData;
    good: const data = LockDataSchema.parse(JSON.parse(raw));

