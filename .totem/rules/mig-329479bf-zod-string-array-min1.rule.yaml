schemaVersion: 1
severity: warning
message: Use z.array(z.string().min(1)) to reject empty strings at parse time instead of filtering them at runtime

target:
  type: ast-grep
  language: typescript
  pattern: z.array(z.string())
  scope:
    fileGlobs:
      - '**/*.ts'

examples:
  - bad: const schema = z.array(z.string());
    good: const schema = z.array(z.string().min(1));

