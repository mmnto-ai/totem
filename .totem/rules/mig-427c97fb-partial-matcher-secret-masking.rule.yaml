schemaVersion: 1
severity: warning
message: Avoid toContain for testing secret masking or data sanitization — use exact string assertions (e.g., toBe or toEqual) to ensure surrounding context is preserved and nothing is over-redacted.

target:
  type: ast-grep
  language: typescript
  pattern: expect($VAL).toContain($EXPECTED)
  scope:
    fileGlobs:
      - '**/*.test.ts'
      - '**/*.spec.ts'

examples:
  - bad: expect(masked).toContain('sk-');
    good: expect(masked).toBe('sk-…redacted');

curation:
  sourceLesson: lesson-427c97fb0063f0cb
  curatedBy: strategy-kimi
  curatedAt: '2026-08-23'
  baseline5Phase: 3
