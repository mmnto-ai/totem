schemaVersion: 1
severity: error
message: Issue numbers are only unique within a single repository;

target:
  type: regex
  pattern: (^|[^a-zA-Z0-9-_./])#\d+
  scope:
    fileGlobs:
      - packages/cli/**/*.ts
      - apps/cli/**/*.ts
    excludeGlobs:
      - '**/*.test.ts'

examples:
  - bad: "const ref = 'fixed in #1234';"
    good: const ref = 'fixed in mmnto-ai/totem#1234';

curation:
  sourceLesson: lesson-54140f59be3e6e44
  curatedBy: strategy-kimi
  curatedAt: '2026-08-23'
  baseline5Phase: 3
