schemaVersion: 1
severity: warning
message: Do not use console.warn in core library packages — use the project-specific logger instead

target:
  type: ast-grep
  language: typescript
  pattern: console.warn($$$ARGS)
  scope:
    fileGlobs:
      - packages/core/**/*.ts
    excludeGlobs:
      - '**/*.test.ts'
      - '**/*.spec.ts'

examples:
  - bad: console.warn('cache miss; rebuilding index');
    good: log.warn('cache miss; rebuilding index');

curation:
  sourceLesson: lesson-427481b534fe3392
  curatedBy: strategy-kimi
  curatedAt: '2026-08-23'
  baseline5Phase: 3
