name: Bug
description: Something is not working — the observed defect and its mechanism at source
labels: ['type: bug']
body:
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: Immediate priority — next 1-2 PRs / Next release cycle / Long-term architecture
      options:
        - tier-1
        - tier-2
        - tier-3
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Every package or surface this touches.
      multiple: true
      options:
        - cli
        - core
        - mcp
        - ci
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened, on which command or surface, with the exact output.
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Mechanism at source
      description: The file, function or line that produces the behaviour, if you found it. Optional.
    validations:
      required: false
  - type: textarea
    id: ask
    attributes:
      label: Ask
      description: The change being requested.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The condition that closes this issue, stated so someone else can check it.
    validations:
      required: true
