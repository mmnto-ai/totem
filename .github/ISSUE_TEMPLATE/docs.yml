name: Docs
description: Documentation drift — a surface that no longer matches the code
labels: ['type: docs']
body:
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: Immediate priority — next 1-2 PRs / Next release cycle / Long-term architecture
      options:
        - tier-1
        - tier-2
        - tier-3
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Every package or surface this touches.
      multiple: true
      options:
        - cli
        - core
        - mcp
        - ci
    validations:
      required: true
  - type: textarea
    id: surface
    attributes:
      label: Surface
      description: The document, path or rendered page this is about.
    validations:
      required: true
  - type: textarea
    id: drift-observed
    attributes:
      label: Drift observed
      description: What the surface says and what the code actually does.
    validations:
      required: true
  - type: textarea
    id: ask
    attributes:
      label: Ask
      description: The change being requested.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The condition that closes this issue, stated so someone else can check it.
    validations:
      required: true
