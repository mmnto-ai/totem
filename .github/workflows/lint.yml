name: Lint

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Totem Lint
    runs-on: ubuntu-latest
    # The release train (mmnto-ai/totem#2779): TRUE only for the Version Packages
    # PR that `changesets/action` rebuilds on every push to main. Both halves are
    # load-bearing — the EXACT branch name (a prefix test is widenable by any
    # author; GitHub compares strings case-insensitively for `==` and
    # `startsWith` alike, so case is not what separates the two) AND the SAME
    # repository (a fork's `head_ref` is the bare branch name, so a fork could
    # name it too). This SELECTS the branch; it does not exempt it — the
    # release-train check step below exempts only a diff with the release-train
    # shape, so a writer who pushes anything else onto that branch meets the
    # gate. Defined once, read by that one step.
    env:
      LEGS_GATE_RELEASE_TRAIN: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'changeset-release/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The release train is OUTSIDE the legs-gate arm (mmnto-ai/totem#2779): the
      # Version Packages PR that `changesets/action` rebuilds on every push to
      # main (`changeset-release/<ref_name of that push>`, so `changeset-release/
      # main` here — the action's default; release.yml passes no `branch:`)
      # deletes the consumed `.changeset/**` files — an owed glob — and authors
      # nothing: its text is the already-merged, already-legged changesets
      # rendered into CHANGELOG.md and package.json. There is no judgment for a
      # leg to falsify, no seat authored the diff, and no deposit can ride a
      # branch the action force-pushes; unguarded, every VP-PR is red at the
      # gate step and the cut cannot execute (2.1.0, mmnto-ai/totem#2778).
      #
      # Identity is NOT the branch name alone. The job-level
      # LEGS_GATE_RELEASE_TRAIN (exact name AND same repository) only selects
      # the branch; this step then runs tools/release-train-shape.sh, which
      # writes `exempt=true` only when HEAD's diff against the base is EXACTLY
      # the release train's work: every changed path is what the action writes
      # (a deleted `.changeset/*.md`, an added or modified
      # `packages/<pkg>/CHANGELOG.md` — a new package's first release ADDS one,
      # PR mmnto-ai/totem#2514 — a modified `packages/<pkg>/package.json`;
      # `packages/*` is the workspace glob, so the private root package.json is
      # out of shape), the deleted changesets are exactly the pending set on the
      # base (never a subset, never its README — the bypass Greptile named on
      # mmnto-ai/totem#2780: deleting one pending changeset and nothing else),
      # and a CHANGELOG was rendered whenever changesets were consumed. That is
      # the shape of every Version Packages PR to date: 259 by head ref, 2,646
      # file entries, zero out of shape (the leg's census; this seat's own
      # read: 252 PRs, 2,572 entries, the same). The release PR is PAT-actored
      # by design (release.yml), so no actor test could authenticate it; the
      # diff can. The trust boundary is the arm's own: the deposit a feature PR
      # commits is author-written too, so the floor was never a defence against
      # a writer forging evidence — it is the sensor that a leg read the head.
      # The script's whole-line anchors keep a path carrying whitespace out of
      # shape; `shell: bash` gives `-o pipefail` and `set -euo pipefail` in both
      # the step and the script: a fetch or diff that FAILS aborts this step and
      # the job — fail-closed. An EMPTY diff with nothing pending is exempt, as
      # the gate itself would derive not-owed on it. Every filter consumes its
      # whole input (`grep`, never `grep -q` under pipefail — a `-q` early exit
      # SIGPIPEs the echo on a large diff and the condition reads false). Either
      # outcome is announced with a STATIC annotation (never-skip-silently, as
      # the advisory annotation below; no derived text rides an annotation) and
      # the reasons print to the log. The cases are executed, not asserted:
      # packages/cli/src/commands/release-train-shape.test.ts. The `totem lint`
      # step still runs either way.
      - name: release-train check (the legs gate is skipped on the Version Packages PR only when its diff has the release-train shape)
        id: release_train
        if: ${{ env.LEGS_GATE_RELEASE_TRAIN == 'true' }}
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          bash tools/release-train-shape.sh "origin/$BASE_REF"
      # HARD gate — the review-leg floor (mmnto-ai/totem#2771; doctrine
      # `model-tiering.md` § The gate; the `legs-gate` parity row, arm (a)).
      # A pull request whose diff touches a path in `hooks.legsOwed.globs` must
      # carry a falsification-leg deposit committed under
      # `.totem/artifacts/legs/` (re-included from the artifacts ignore) that is
      # ancestor-or-equal of the head and covers an owed path. Exit 3 (owed,
      # unanswered) and exit 2 (could not derive) fail the check; not owed and
      # evidence exit 0. It holds whatever the local hook tier is, and
      # `--no-verify` never reaches it. `Totem Lint` is a required check on main
      # (ruleset `main-required-checks`), so red blocks the merge. The only
      # skip is the release train above, and only when the check step derived
      # the release-train shape: a skipped check step writes no output, and
      # `'' != 'true'` runs the gate — fail-closed.
      #
      # Placed BEFORE the lint step's `--depth=1` fetch on purpose: that fetch
      # SHALLOWS the full checkout (`.git/shallow` appears — measured on a local
      # clone; a later plain fetch does not undo it), and a shallow base tip has
      # no parents, so the coverage probe's merge-base against a branch forked
      # below the tip cannot resolve and the gate would report NOT DERIVED. On
      # the fetch-depth: 0 checkout above, origin/<base> is complete.
      #
      # The `node packages/cli/dist/index.js` form, like every other step here,
      # and NOT `pnpm exec totem`: pnpm links bins at INSTALL time and skips one
      # whose target is absent — @mmnto/cli's bin points at packages/cli/dist,
      # which exists only after the build step — so `pnpm exec totem` resolves
      # only where a global totem masks the miss (measured; the leg's F1 on
      # mmnto-ai/totem#2771). On a runner it would fail every pull request.
      - name: totem legs gate (HARD — the review-leg floor)
        if: ${{ steps.release_train.outputs.exempt != 'true' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          node packages/cli/dist/index.js legs gate

      # ADVISORY until the rule-compilation freeze lifts (the convergent spine).
      # The compiled lesson-rules carry frozen #2055-class false-positives that
      # cannot be recompiled away under the freeze (safe-regex2 ReDoS gate). A
      # perma-red check trains bypass-blindness and masks a future REAL regression
      # (red->red is invisible) — so the job keeps RUNNING (findings still print)
      # but is non-failing. The clean deterministic gates stay hard in the pre-push
      # hook + the PR bot review is the real gate. Drop continue-on-error when the
      # spine makes these rules legitimate again.
      # mmnto-ai/totem-strategy#430 · mmnto-ai/totem#2055 · mirrors strategy#656
      - name: Run totem lint (ADVISORY — frozen lesson-rules pending spine)
        id: totem_lint
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Ensure the base branch is available for diff (env-mapped to avoid
          # template injection into the shell — zizmor template-injection).
          git fetch origin "$BASE_REF" --depth=1
          node packages/cli/dist/index.js lint

      # Surface the advisory state as a REAL GitHub annotation (PR checks pane +
      # annotations rail), not just the step name — so a green job never reads as
      # "lint clean" when the frozen rules actually flagged something
      # (never-skip-silently). Fires only when the advisory lint had findings.
      - name: Advisory annotation (when totem lint flagged findings)
        if: steps.totem_lint.outcome == 'failure'
        run: |
          echo "::warning title=Totem lint ADVISORY::Totem lint flagged findings but the job is advisory — these may be #2055-class false-positives from frozen lesson-rules (safe-regex2 freeze). Drop continue-on-error when the spine recompiles. Refs: mmnto-ai/totem#2055, mmnto-ai/totem-strategy#430."

      # NOTE (advisory posture): the SARIF steps below still run while the lint job
      # is advisory, so frozen #2055-class false-positives surface as Code Scanning
      # alerts under the `totem-lint` category. Kept ON deliberately — the findings
      # are an audit trail for the #474 false-positive measurement, and the dedicated
      # `totem-lint` category keeps them from masking CodeQL alerts (separate
      # category). Revisit (gate the upload) if the category gets noisy enough to
      # bury a real finding. Refs: mmnto-ai/totem#2055.
      - name: Generate SARIF report
        if: always()
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
          node packages/cli/dist/index.js lint --format sarif --out totem-lint.sarif || true

      # KEPT under the 2026-08-29 cohort word ("drop upload-sarif where code
      # scanning is disabled"): code scanning is live here — the
      # code-scanning/analyses API lists ingested `totem-lint` analyses.
      - name: Upload SARIF to GitHub Security
        id: upload-sarif
        if: always() && hashFiles('totem-lint.sarif') != ''
        continue-on-error: true # #1226: SARIF serialization bugs shouldn't block PRs
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: totem-lint.sarif
          category: totem-lint

      # #2296: continue-on-error keeps a rejected upload from blocking the PR,
      # but it also hid three months of silent code-scanning darkness.
      # upload-sarif already waits for GitHub ingestion by default
      # (wait-for-processing defaults to true), so a processing rejection lands
      # here as outcome == 'failure' — surface it as a non-blocking warning
      # annotation so it can't go dark unnoticed again (the audit-trail category
      # is kept ON deliberately, #474).
      - name: Surface SARIF processing failures (non-blocking, #2296)
        if: always() && steps.upload-sarif.outcome == 'failure'
        run: |
          echo "::warning title=Totem SARIF upload rejected::GitHub rejected the totem-lint SARIF analysis (upload step outcome=failure); code-scanning is dark for this run. See the 'Upload SARIF to GitHub Security' step log. Refs: mmnto-ai/totem#2296."

      - name: Run drift check
        run: node packages/cli/dist/index.js drift

      # HARD gate (unlike the advisory lint above — this check does not depend on
      # the frozen lesson-rules). CI backstop for the lockfile-sync gate: the pre-push
      # hook can be absent or bypassed, and `pnpm install --frozen-lockfile` above
      # accepts an internally-consistent lockfile that silently dropped an
      # optional dependency whose pin is still declared (the silent-removal class;
      # see docs/wiki/cli-reference.md § verify-lockfile-sync).
      - name: Verify lockfile sync
        run: node packages/cli/dist/index.js verify-lockfile-sync
