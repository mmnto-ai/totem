name: Compile Manifest Attestation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.totem/compiled-rules.json'
      - '.totem/compile-manifest.json'
      - '.totem/lessons/**'
      # Prop 310 § Design 1 — the record file class the manifest's `records_hash`
      # attests. Without this path, a records-only change would skip the gate that
      # is the only thing checking that attestation.
      - '.totem/rules/**'
      - 'packages/core/src/compiler*'
      # The hashing implementation itself — `generateInputHash`, `generateRecordsHash`,
      # and the manifest schema all live here, so a change to it must re-run the gate
      # that checks its output.
      - 'packages/core/src/compile-manifest.ts'
      - 'packages/cli/src/commands/compile.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile Manifest Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for [UPDATE-RULES] bypass
        id: bypass
        env:
          PR_TITLE: ${{ github.event.pull_request.title }} # totem-ignore — #875: env mapping IS the safe pattern
          PR_BODY: ${{ github.event.pull_request.body }} # totem-ignore — #875: env mapping IS the safe pattern
        run: |
          if [[ "$PR_TITLE $PR_BODY" == *"[UPDATE-RULES]"* ]]; then # totem-ignore — #875: vars are env-mapped above
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ [UPDATE-RULES] found — skipping manifest verification"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.bypass.outputs.skip != 'true'

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.bypass.outputs.skip != 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.bypass.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.bypass.outputs.skip != 'true'

      - run: pnpm build
        if: steps.bypass.outputs.skip != 'true'

      - name: Verify compile manifest hashes
        if: steps.bypass.outputs.skip != 'true'
        run: node packages/cli/dist/index.js verify-manifest
