name: Doctor

# Repo-state diagnostics gate. Mirrors `totem lint` (diff-shape gate) with
# `totem doctor --strict` (repo-shape gate) per Proposal 273 § 7 routing matrix
# row 6 (Repo + Auto + PR-time). Reference: mmnto-ai/totem#1908.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: Totem Doctor (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Run totem doctor --strict
        run: node packages/cli/dist/index.js doctor --strict
