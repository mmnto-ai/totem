schemaVersion: 1

severity: warning
message: "Avoid 'pwd' in credential-scanning regexes — in Node.js it may refer to 'present working directory', causing false positives"

target:
  type: ast-grep
  language: typescript
  pattern: 'new RegExp($$$ARGS)'
  scope:
    fileGlobs:
      - 'packages/cli/src/assets/**/*.ts'

examples:
  - bad: |-
      const CREDENTIAL_RE = new RegExp('(password|passwd|pwd|secret)\\s*[:=]', 'i');
    good: |-
      const CREDENTIAL_RE = new RegExp('(password|passwd|secret)\\s*[:=]', 'i');

curation:
  sourceLesson: 'lesson-b237bcf3b52381b1'
