schemaVersion: 1

severity: warning
message: 'Never inline secrets/tokens/API keys in agent config files. Use gitignored .env files instead — MCP servers inherit env vars from the shell automatically.'

target:
  type: ast-grep
  language: json
  pattern: '{ $$$BEFORE, "env": { $$$ENV_VARS }, $$$AFTER }'
  scope:
    fileGlobs:
      - '**/.mcp.json'
      - '**/.gemini/settings.json'
      - '**/mcp*.json'
      - '**/.cursor/mcp.json'

examples:
  - bad: '{ "command": "npx", "env": { "GITHUB_TOKEN": "ghp_9f2c1ab4de7845c0b3" }, "args": ["-y", "mcp-github"] }'
    good: '{ "command": "npx", "args": ["-y", "mcp-github"] }'

curation:
  sourceLesson: 'lesson-1a7080ebf6162de3'
